<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorteo Labisol Glow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --stage:#17130f;
    --stage-2:#211a15;
    --cream:#f7efe6;
    --cream-dim:#cabcaa;
    --sage:#8a9e82;
    --sage-deep:#5f7a5c;
    --berry:#b23a63;
    --berry-bright:#d9548a;
    --terracotta:#c97a46;
    --gold:#d4af61;
    --gold-bright:#ecd08a;
    --ring: rgba(212,175,97,.35);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse 900px 600px at 18% 10%, rgba(138,158,130,.16), transparent 60%),
      radial-gradient(ellipse 900px 700px at 85% 90%, rgba(178,58,99,.16), transparent 60%),
      var(--stage);
    color:var(--cream);
    font-family:'Sora', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    position:relative;
  }

  /* ---------- ambient stage ---------- */
  .orb{
    position:fixed;
    border-radius:50%;
    filter:blur(60px);
    opacity:.35;
    pointer-events:none;
    animation:drift 18s ease-in-out infinite;
  }
  .orb.a{width:420px;height:420px;background:var(--sage);top:-120px;left:-100px;animation-duration:22s;}
  .orb.b{width:380px;height:380px;background:var(--berry);bottom:-140px;right:-80px;animation-duration:26s;animation-delay:-6s;}
  .orb.c{width:280px;height:280px;background:var(--gold);top:40%;right:10%;opacity:.18;animation-duration:20s;animation-delay:-10s;}
  @keyframes drift{
    0%,100%{transform:translate(0,0) scale(1);}
    50%{transform:translate(30px,-25px) scale(1.08);}
  }

  .sparkle{
    position:fixed;
    width:3px;height:3px;
    background:var(--gold-bright);
    border-radius:50%;
    opacity:0;
    pointer-events:none;
    animation:twinkle 3.4s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{opacity:0; transform:scale(.6);}
    50%{opacity:.9; transform:scale(1.6);}
  }

  /* ---------- shell ---------- */
  .stagewrap{
    position:relative;
    width:100%;
    max-width:640px;
    padding:32px 28px 40px;
    text-align:center;
    z-index:2;
  }

  .reset-btn{
    position:fixed;
    top:18px;
    right:18px;
    width:38px;height:38px;
    border-radius:50%;
    border:1px solid rgba(247,239,230,.18);
    background:rgba(247,239,230,.04);
    color:var(--cream-dim);
    font-size:17px;
    line-height:1;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    opacity:.45;
    transition:opacity .2s ease, transform .3s ease, background .2s ease;
    z-index:50;
  }
  .reset-btn:hover{opacity:1; background:rgba(247,239,230,.09);}
  .reset-btn:active{transform:rotate(-40deg);}
  .reset-btn:focus-visible{outline:2px solid var(--gold); outline-offset:2px; opacity:1;}

  /* ---------- brand mark ---------- */
  .mark{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:64px;height:64px;
    border-radius:50%;
    border:1px solid rgba(138,158,130,.4);
    background:rgba(138,158,130,.08);
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:600;
    font-size:26px;
    color:var(--sage);
    margin-bottom:18px;
  }

  .tagline{
    font-size:12.5px;
    letter-spacing:.06em;
    color:var(--cream-dim);
    margin:0 0 6px;
  }

  h1.title{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(32px, 6vw, 46px);
    line-height:1.06;
    margin:0 0 10px;
    color:var(--cream);
  }
  h1.title em{
    font-style:italic;
    font-weight:500;
    color:var(--gold-bright);
  }

  .subtitle{
    font-size:15.5px;
    color:var(--cream-dim);
    margin:0 0 28px;
    line-height:1.5;
  }

  /* ---------- tier chips ---------- */
  .tiers{
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
    margin-bottom:34px;
  }
  .chip{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:2px;
    padding:10px 16px;
    border-radius:14px;
    background:rgba(247,239,230,.04);
    border:1px solid var(--chip-c, rgba(247,239,230,.15));
    min-width:112px;
  }
  .chip b{font-family:'Fraunces', serif; font-size:18px; font-weight:600; color:var(--chip-c);}
  .chip span{font-size:11.5px; color:var(--cream-dim);}
  .chip.done{opacity:.35;}

  /* ---------- CTA ---------- */
  .cta{
    position:relative;
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:18px 40px;
    border:none;
    border-radius:100px;
    font-family:'Sora', sans-serif;
    font-weight:700;
    font-size:16.5px;
    color:#1a1310;
    background:linear-gradient(120deg, var(--gold-bright), var(--gold) 55%, var(--berry-bright));
    cursor:pointer;
    box-shadow:0 0 0 0 var(--ring);
    animation:pulse 2.6s ease-in-out infinite;
    transition:transform .18s ease, box-shadow .18s ease;
    letter-spacing:.01em;
  }
  .cta:hover{transform:translateY(-2px) scale(1.02);}
  .cta:active{transform:translateY(0) scale(.98);}
  .cta:focus-visible{outline:3px solid var(--cream); outline-offset:3px;}
  .cta:disabled{opacity:.5; cursor:default; animation:none;}
  @keyframes pulse{
    0%,100%{box-shadow:0 0 0 0 var(--ring);}
    50%{box-shadow:0 0 0 14px rgba(212,175,97,0);}
  }

  .progress{
    margin-top:22px;
    font-size:13px;
    color:var(--cream-dim);
    letter-spacing:.02em;
  }

  /* ---------- screens ---------- */
  .screen{display:none;}
  .screen.active{display:block; animation:fadein .5s ease both;}
  @keyframes fadein{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

  /* ---------- drawing screen ---------- */
  .drawing-tier{
    font-size:13.5px;
    color:var(--cream-dim);
    margin-bottom:6px;
  }
  .drawing-tier b{color:var(--tier-c, var(--gold));}

  .reel{
    margin:18px auto 26px;
    padding:36px 24px;
    border-radius:22px;
    background:rgba(247,239,230,.035);
    border:1px solid rgba(247,239,230,.12);
    position:relative;
    overflow:hidden;
  }
  .reel::before{
    content:'';
    position:absolute; inset:0;
    background:radial-gradient(ellipse at center, rgba(212,175,97,.10), transparent 70%);
  }
  .reel-name{
    position:relative;
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(26px, 6vw, 36px);
    color:var(--cream);
    filter:blur(0px);
    transition:filter .05s linear;
  }
  .reel.spinning .reel-name{filter:blur(2px); opacity:.85;}
  .reel-hint{
    position:relative;
    margin-top:10px;
    font-size:12.5px;
    color:var(--cream-dim);
  }

  /* ---------- reveal screen ---------- */
  .reveal-eyebrow{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:16px;
    color:var(--gold-bright);
    margin:0 0 8px;
  }
  .reveal-card{
    margin:0 auto 22px;
    padding:38px 28px 30px;
    border-radius:26px;
    background:rgba(247,239,230,.04);
    border:1px solid var(--tier-c, var(--gold));
    box-shadow:0 0 60px -18px var(--tier-c, var(--gold));
    position:relative;
  }
  .winner-name{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:clamp(30px, 7vw, 44px);
    line-height:1.1;
    margin:0 0 14px;
    color:var(--cream);
  }
  .winner-tag{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:8px 18px;
    border-radius:100px;
    background:var(--tier-c, var(--gold));
    color:#1a1310;
    font-weight:700;
    font-size:15px;
  }

  .revealed-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
    max-width:560px;
    margin:0 auto 26px;
  }
  .revealed-chip{
    font-size:12px;
    padding:6px 12px;
    border-radius:100px;
    background:rgba(247,239,230,.05);
    border:1px solid rgba(247,239,230,.14);
    color:var(--cream-dim);
  }
  .revealed-chip b{color:var(--cream); font-weight:600;}

  /* ---------- summary screen ---------- */
  .summary-total{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(26px,5vw,34px);
    margin:0 0 30px;
  }
  .summary-total em{font-style:italic; color:var(--gold-bright);}

  .tier-block{
    text-align:left;
    margin-bottom:22px;
    padding:18px 20px;
    border-radius:18px;
    background:rgba(247,239,230,.03);
    border-left:3px solid var(--tier-c, var(--gold));
  }
  .tier-block h3{
    margin:0 0 10px;
    font-family:'Sora', sans-serif;
    font-size:13.5px;
    font-weight:700;
    color:var(--tier-c, var(--gold));
  }
  .tier-block ul{
    list-style:none; margin:0; padding:0;
    display:flex; flex-wrap:wrap; gap:8px 18px;
  }
  .tier-block li{
    font-family:'Fraunces', serif;
    font-size:16px;
    color:var(--cream);
  }

  .ghost-btn{
    margin-top:8px;
    background:none;
    border:1px solid rgba(247,239,230,.25);
    color:var(--cream);
    padding:13px 26px;
    border-radius:100px;
    font-family:'Sora', sans-serif;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    transition:background .2s ease, border-color .2s ease;
  }
  .ghost-btn:hover{background:rgba(247,239,230,.06); border-color:rgba(247,239,230,.4);}
  .ghost-btn:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}

  /* ---------- confetti ---------- */
  #confetti-layer{
    position:fixed; inset:0;
    pointer-events:none;
    z-index:40;
    overflow:hidden;
  }
  .confetto{
    position:absolute;
    top:-20px;
    border-radius:2px;
    animation:fall linear forwards;
  }
  @keyframes fall{
    to{ transform:translateY(110vh) rotate(var(--rot)); opacity:.9; }
  }

  @media (max-width:480px){
    .stagewrap{padding:22px 18px 32px;}
    .chip{min-width:96px; padding:9px 12px;}
  }

  @media (prefers-reduced-motion: reduce){
    .orb, .sparkle, .cta{animation:none;}
    .screen.active{animation:none;}
  }
</style>
</head>
<body>

  <div class="orb a"></div>
  <div class="orb b"></div>
  <div class="orb c"></div>
  <div id="sparkles"></div>
  <div id="confetti-layer"></div>

  <button class="reset-btn" id="resetBtn" title="Reiniciar sorteo" aria-label="Reiniciar sorteo">⟲</button>

  <main class="stagewrap">

    <!-- IDLE -->
    <section class="screen active" id="screen-idle">
      <div class="mark">LB</div>
      <p class="tagline">Belleza cada día</p>
      <h1 class="title">Sorteo <em>Labisol Glow</em></h1>
      <p class="subtitle">14 ganadoras y ganadores se llevan $350.000 en órdenes de compra.</p>

      <div class="tiers" id="tierChips">
        <div class="chip" style="--chip-c:var(--terracotta)"><b>10</b><span>de $10.000</span></div>
        <div class="chip" style="--chip-c:var(--berry-bright)"><b>3</b><span>de $50.000</span></div>
        <div class="chip" style="--chip-c:var(--gold-bright)"><b>1</b><span>de $100.000</span></div>
      </div>

      <button class="cta" id="startBtn">Empezar sorteo</button>
      <p class="progress" id="idleProgress"></p>
    </section>

    <!-- DRAWING -->
    <section class="screen" id="screen-drawing">
      <p class="drawing-tier">Sorteando <b id="drawingTierLabel"></b></p>
      <div class="reel spinning" id="reel">
        <p class="reel-name" id="reelName">&nbsp;</p>
        <p class="reel-hint">Elegimos a alguien de la lista de pedidos…</p>
      </div>
      <p class="progress" id="drawingProgress"></p>
    </section>

    <!-- REVEAL -->
    <section class="screen" id="screen-reveal">
      <p class="reveal-eyebrow">¡Felicitaciones!</p>
      <div class="reveal-card" id="revealCard">
        <p class="winner-name" id="winnerName"></p>
        <span class="winner-tag" id="winnerTag"></span>
      </div>
      <div class="revealed-row" id="revealedRow"></div>
      <button class="cta" id="nextBtn">Siguiente ganador/a</button>
      <p class="progress" id="revealProgress"></p>
    </section>

    <!-- SUMMARY -->
    <section class="screen" id="screen-summary">
      <p class="tagline">Sorteo Labisol Glow</p>
      <h2 class="summary-total">$350.000 repartidos entre <em>14 personas</em></h2>
      <div id="summaryBlocks"></div>
      <button class="ghost-btn" id="restartBtn">Volver a empezar</button>
    </section>

  </main>

<script>
/* ============ datos de participantes (nombre, apellido) ============ */
const ENTRIES = [{"nombre": "Guillermo", "apellido": "Olmedo"}, {"nombre": "Lara Nail", "apellido": "Sosa"}, {"nombre": "Carolina", "apellido": "Paredes"}, {"nombre": "Camila Luciana", "apellido": "Cardenas"}, {"nombre": "Milagro", "apellido": "Pérez"}, {"nombre": "Maria", "apellido": "Boetto"}, {"nombre": "Maria Macarena", "apellido": "Gimenez"}, {"nombre": "Brenda", "apellido": "Rodriguez"}, {"nombre": "Milagros", "apellido": "Tula"}, {"nombre": "Gisel", "apellido": "Valenzuela"}, {"nombre": "Naiara", "apellido": "Encina"}, {"nombre": "Abril Agustina", "apellido": "Lucero"}, {"nombre": "Crysthian", "apellido": "Kalitko"}, {"nombre": "Candela", "apellido": "Gutierrez"}, {"nombre": "Juliana", "apellido": "Guzmán"}, {"nombre": "Fatima", "apellido": "Pacheco"}, {"nombre": "Xiomara", "apellido": "Balbuena"}, {"nombre": "Matias Martin", "apellido": "Farina"}, {"nombre": "Mía Morena", "apellido": "Barreiro"}, {"nombre": "Stefania Solange", "apellido": "Ibañez"}, {"nombre": "Vanesa", "apellido": "Rubin"}, {"nombre": "Noe", "apellido": "Sol"}, {"nombre": "Milagros", "apellido": "Silvetti"}, {"nombre": "Noe", "apellido": "Sol"}, {"nombre": "Yamila", "apellido": "Aguilar"}, {"nombre": "Valeria", "apellido": "Ferreira"}, {"nombre": "Jesica", "apellido": "Carro"}, {"nombre": "Priscila", "apellido": "Giacovino"}, {"nombre": "Rocio", "apellido": "García"}, {"nombre": "Yanaina", "apellido": "Constante"}, {"nombre": "Valentina", "apellido": "Bernat"}, {"nombre": "Dayana", "apellido": "Sanchez"}, {"nombre": "Katherina", "apellido": "Ramirez"}, {"nombre": "Noelia", "apellido": "Rosani"}, {"nombre": "Camila", "apellido": "Oviedo"}, {"nombre": "Brisa", "apellido": "Porto"}, {"nombre": "Idalina", "apellido": "Gladun"}, {"nombre": "Belen", "apellido": "Ruiz Diaz"}, {"nombre": "Luciana", "apellido": "Mamani"}, {"nombre": "Brisa", "apellido": "Farias"}, {"nombre": "Natalia", "apellido": "Pesalacha"}, {"nombre": "Adriana", "apellido": "Maizares"}, {"nombre": "Ludmila", "apellido": "Astrada"}, {"nombre": "Agustina", "apellido": "Velazquez"}, {"nombre": "Cintia", "apellido": "Gimenez"}, {"nombre": "Xiomara", "apellido": "Badillo"}, {"nombre": "Angeles", "apellido": "Muñoz"}, {"nombre": "Andrea", "apellido": "Goldaracena"}, {"nombre": "Noe", "apellido": "Acosta"}, {"nombre": "Adriana", "apellido": "Casas"}, {"nombre": "Agustina Ayelen", "apellido": "Villarroel"}, {"nombre": "Liliana", "apellido": "Montes"}, {"nombre": "Santi", "apellido": "Jesus"}, {"nombre": "Anabela", "apellido": "Huenchual"}, {"nombre": "Belinda", "apellido": "Luna"}, {"nombre": "Paola", "apellido": "López"}, {"nombre": "Micaela", "apellido": "Gonzalez"}, {"nombre": "María Sol", "apellido": "Garrido García"}, {"nombre": "Leandro", "apellido": "Gomez"}, {"nombre": "Yoana", "apellido": "Villanueva"}, {"nombre": "Jonathan", "apellido": "Flores"}, {"nombre": "Eugenia", "apellido": "Barbieris"}, {"nombre": "Alma", "apellido": "Eckerdt"}, {"nombre": "Patricia Anabel", "apellido": "Acosta"}, {"nombre": "Sol", "apellido": "Baldovino"}, {"nombre": "Ailin", "apellido": "Ruiz"}, {"nombre": "Micaela", "apellido": "Neyra"}, {"nombre": "Yohana", "apellido": "Luna"}, {"nombre": "Mayra", "apellido": "Mancilla"}, {"nombre": "Agostina", "apellido": "Perez De Marco"}, {"nombre": "Micaela", "apellido": "Alarcon"}, {"nombre": "Carla", "apellido": "Benitez"}, {"nombre": "Lorenzo", "apellido": "Valent"}, {"nombre": "Maia", "apellido": "Palazzini"}, {"nombre": "Abigail", "apellido": "Funes"}, {"nombre": "Cintia", "apellido": "Paesani"}, {"nombre": "Milagros", "apellido": "Saavedra"}, {"nombre": "Debora", "apellido": "Marin"}, {"nombre": "Aldana", "apellido": "Orieta"}, {"nombre": "Noelia", "apellido": "Perez"}, {"nombre": "Andres", "apellido": "Pozzi"}, {"nombre": "Valeria", "apellido": "Astorelli"}, {"nombre": "Carla", "apellido": "Pintos"}, {"nombre": "Nadia", "apellido": "Calfulef"}, {"nombre": "Rocio", "apellido": "Albarracin"}, {"nombre": "Xiomara", "apellido": "Moreno"}, {"nombre": "Lionel", "apellido": "Martinez"}, {"nombre": "Willi", "apellido": "Wu"}, {"nombre": "Marcela", "apellido": "Casco"}, {"nombre": "Nancy", "apellido": "Rojas"}, {"nombre": "Mía Morena", "apellido": "Barreiro"}, {"nombre": "Mariel", "apellido": "Pereyra"}, {"nombre": "Agostina", "apellido": "Albornoz"}, {"nombre": "Willi", "apellido": "Wu"}, {"nombre": "Mabel", "apellido": "Tufanisco"}, {"nombre": "Valentina", "apellido": "Maza"}, {"nombre": "Guadalupe", "apellido": "Rios"}, {"nombre": "Monica", "apellido": "Gomez"}, {"nombre": "Cristian", "apellido": "Casas"}, {"nombre": "Cintia", "apellido": "Gimenez"}, {"nombre": "Flavia Gabriela", "apellido": "Cornalo"}, {"nombre": "Eva Montserrat", "apellido": "Puglisi"}, {"nombre": "Mariana", "apellido": "Loyola"}, {"nombre": "Brisa Evelin", "apellido": "Maldonado"}, {"nombre": "Rocío", "apellido": "Quiroga"}, {"nombre": "Kiara", "apellido": "Oyarce"}, {"nombre": "Micaela", "apellido": "Torales"}, {"nombre": "Muñoz", "apellido": "Dana"}, {"nombre": "Agustina", "apellido": "Velazquez"}, {"nombre": "Lourdes", "apellido": "Huilcapan"}];

/* ============ configuración de premios ============ */
const TIERS = [
  { id:'t10',  amount:10000,  count:10, color:'var(--terracotta)',   label:'premio de $10.000' },
  { id:'t50',  amount:50000,  count:3,  color:'var(--berry-bright)', label:'premio de $50.000' },
  { id:'t100', amount:100000, count:1,  color:'var(--gold-bright)',  label:'premio de $100.000' },
];
const TOTAL_WINNERS = TIERS.reduce((a,t)=>a+t.count,0);

/* cola de sorteo en orden: primero los de $10.000, cierre con el de $100.000 */
function buildQueue(){
  const q = [];
  TIERS.forEach(t=>{ for(let i=0;i<t.count;i++) q.push(t); });
  return q;
}

let pool = [];
let queue = [];
let winners = [];
let step = 0;
let drawTimer = null;

function norm(s){ return (s||'').trim().toLowerCase(); }
function sameEntry(a,b){ return norm(a.nombre)===norm(b.nombre) && norm(a.apellido)===norm(b.apellido); }
function fullName(e){ return `${e.nombre} ${e.apellido}`; }
function money(n){ return '$' + n.toLocaleString('es-AR'); }

function resetState(){
  pool = ENTRIES.slice();
  queue = buildQueue();
  winners = [];
  step = 0;
  clearTimeout(drawTimer);
  updateIdleChips();
  showScreen('idle');
}

/* ---------- navegación entre pantallas ---------- */
function showScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
}

function updateIdleChips(){
  document.getElementById('idleProgress').textContent =
    winners.length ? `Ya sorteaste ${winners.length} de ${TOTAL_WINNERS}` : '';
  const chips = document.querySelectorAll('#tierChips .chip');
  TIERS.forEach((t,i)=>{
    const remaining = t.count - winners.filter(w=>w.tier.id===t.id).length;
    chips[i].querySelector('b').textContent = remaining;
    chips[i].classList.toggle('done', remaining===0);
  });
}

/* ---------- animación de sorteo ---------- */
function startDraw(){
  if(step >= queue.length) return;
  const tier = queue[step];
  document.getElementById('drawingTierLabel').textContent = tier.label;
  document.getElementById('drawingProgress').textContent = `Ganador/a ${step+1} de ${TOTAL_WINNERS}`;
  showScreen('drawing');

  const reel = document.getElementById('reel');
  const reelName = document.getElementById('reelName');
  reel.classList.add('spinning');

  // se define el ganador ahora mismo (al azar, sin reemplazo)
  const idx = Math.floor(Math.random() * pool.length);
  const winner = pool[idx];

  let tick = 0;
  const totalTicks = 20; // ~2.5s de suspenso, frenando de a poco
  function spin(){
    if(tick < totalTicks - 1){
      const sample = pool[Math.floor(Math.random()*pool.length)];
      reelName.textContent = fullName(sample);
      tick++;
      const delay = 40 + tick * 9; // se va frenando
      drawTimer = setTimeout(spin, delay);
    } else {
      reel.classList.remove('spinning');
      reelName.textContent = fullName(winner);
      drawTimer = setTimeout(()=>revealWinner(winner, tier), 550);
    }
  }
  spin();
}

function revealWinner(winner, tier){
  // se saca del pool a la persona completa (todas sus entradas) para que no vuelva a salir
  pool = pool.filter(e => !sameEntry(e, winner));
  winners.push({ ...winner, tier });
  step++;

  document.getElementById('revealCard').style.setProperty('--tier-c', tier.color);
  document.getElementById('winnerName').textContent = fullName(winner);
  document.getElementById('winnerTag').textContent = money(tier.amount) + ' en compras';
  document.getElementById('winnerTag').style.background = tier.color;

  renderRevealedRow();

  const isLast = step >= queue.length;
  document.getElementById('nextBtn').textContent = isLast ? 'Ver resumen final' : 'Siguiente ganador/a';
  document.getElementById('revealProgress').textContent = `Ganador/a ${step} de ${TOTAL_WINNERS}`;

  showScreen('reveal');
  burstConfetti(tier.color);
}

function renderRevealedRow(){
  const row = document.getElementById('revealedRow');
  row.innerHTML = winners.map(w =>
    `<span class="revealed-chip"><b>${w.nombre} ${w.apellido}</b> · ${money(w.tier.amount)}</span>`
  ).join('');
}

/* ---------- resumen final ---------- */
function showSummary(){
  const wrap = document.getElementById('summaryBlocks');
  wrap.innerHTML = TIERS.map(t=>{
    const items = winners.filter(w=>w.tier.id===t.id)
      .map(w=>`<li>${w.nombre} ${w.apellido}</li>`).join('');
    return `<div class="tier-block" style="--tier-c:${t.color}">
        <h3>${t.count} × ${money(t.amount)}</h3>
        <ul>${items}</ul>
      </div>`;
  }).join('');
  showScreen('summary');
}

/* ---------- confetti liviano, sin librerías ---------- */
const CONFETTI_COLORS = ['#8a9e82','#b23a63','#d9548a','#c97a46','#d4af61','#f7efe6'];
function burstConfetti(accent){
  const layer = document.getElementById('confetti-layer');
  const varMatch = accent.match(/--[\w-]+/);
  const accentResolved = varMatch ? getComputedStyle(document.documentElement).getPropertyValue(varMatch[0]).trim() : null;
  const n = 46;
  for(let i=0;i<n;i++){
    const el = document.createElement('div');
    el.className = 'confetto';
    const color = (accentResolved && Math.random() < 0.35) ? accentResolved : CONFETTI_COLORS[Math.floor(Math.random()*CONFETTI_COLORS.length)];
    el.style.left = Math.random()*100 + 'vw';
    el.style.width = (5 + Math.random()*5) + 'px';
    el.style.height = (8 + Math.random()*10) + 'px';
    el.style.background = color;
    el.style.setProperty('--rot', (Math.random()*720-360) + 'deg');
    el.style.animationDuration = (2.2 + Math.random()*1.6) + 's';
    el.style.animationDelay = (Math.random()*0.3) + 's';
    layer.appendChild(el);
    setTimeout(()=>el.remove(), 4200);
  }
}

/* ---------- chispas ambientales en la pantalla de inicio ---------- */
function seedSparkles(){
  const holder = document.getElementById('sparkles');
  for(let i=0;i<16;i++){
    const s = document.createElement('div');
    s.className = 'sparkle';
    s.style.left = Math.random()*100 + 'vw';
    s.style.top = Math.random()*100 + 'vh';
    s.style.animationDelay = (Math.random()*3.4) + 's';
    holder.appendChild(s);
  }
}

/* ---------- eventos ---------- */
document.getElementById('startBtn').addEventListener('click', startDraw);
document.getElementById('nextBtn').addEventListener('click', ()=>{
  if(step >= queue.length){ showSummary(); }
  else { startDraw(); }
});
document.getElementById('restartBtn').addEventListener('click', resetState);
document.getElementById('resetBtn').addEventListener('click', ()=>{
  if(winners.length === 0 || confirm('¿Reiniciar el sorteo desde cero? Se pierde el progreso actual.')){
    resetState();
  }
});

seedSparkles();
resetState();
</script>
